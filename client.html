:root{
  --ink:#14121F; --emerald:#6D4AFF; --emerald-2:#8B6DFF; --deep:#0E0C18;
  --sage:#E4DDFF; --sage-soft:#F3F0FF;
  --cream:#F6F5F9; --paper:#FFFFFF; --sand:#E9E7F0; --line:#E7E5EE;
  --accent:#FF5C8A; --accent-2:#FF9DB8; --accent-soft:#FFE6EE;
  --gold:#F5A524; --muted:#6E6A7C; --faint:#A3A0B0;
  --serif:'Noto Serif Georgian',Georgia,serif;
  --safe:0px;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{font-family:'Noto Sans Georgian',system-ui,sans-serif;color:var(--ink);background:var(--cream);overflow:hidden;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;cursor:pointer}
svg.i{width:1em;height:1em;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}
svg.f{fill:currentColor;stroke:none}

/* ============ SHELL (desktop presentation) ============ */
.shell{display:grid;grid-template-columns:minmax(360px,430px) 1fr;height:100vh;height:100dvh}
.panel{background:var(--ink);color:var(--cream);padding:40px 38px 28px;display:flex;flex-direction:column;position:relative;overflow:auto}
.panel::before{content:"";position:absolute;width:460px;height:460px;border-radius:50%;right:-260px;top:-190px;
  background:radial-gradient(circle at 35% 60%,rgba(139,109,255,.75),rgba(139,109,255,0) 62%);pointer-events:none}
.panel::after{content:"";position:absolute;width:360px;height:360px;border-radius:50%;left:-170px;bottom:-210px;
  border:1px solid rgba(246,245,249,.1);box-shadow:0 0 0 42px rgba(246,245,249,.025);pointer-events:none}
.panel>*{position:relative;z-index:1}
.brand{display:flex;align-items:center;gap:12px}
.mark{width:42px;height:42px;border-radius:13px;background:var(--cream);display:grid;place-items:center;color:var(--emerald);font-size:26px}
.brand .name{font-family:var(--serif);font-weight:800;font-size:23px;line-height:1}
.brand .sub{font-size:8.5px;letter-spacing:.2em;color:rgba(246,245,249,.6);margin-top:6px;font-weight:600}
.pill{display:inline-flex;align-items:center;gap:8px;font-size:9.5px;font-weight:700;letter-spacing:.16em;color:var(--accent-2);
  border:1px solid rgba(255,157,184,.35);border-radius:999px;padding:6px 12px 6px 10px;align-self:flex-start;margin-top:34px}
.pill i{width:6px;height:6px;border-radius:50%;background:var(--accent-2);display:block;animation:blink 2s infinite}
@keyframes blink{50%{opacity:.35}}
.panel h1{font-family:var(--serif);font-weight:700;font-size:30px;line-height:1.28;margin-top:16px}
.panel h1 em{font-style:normal;color:var(--accent-2)}
.panel .lead{font-size:13px;line-height:1.65;color:rgba(246,245,249,.72);margin-top:12px}
.eyebrow{font-size:9.5px;font-weight:700;letter-spacing:.2em}
.track{margin-top:26px}
.track .eyebrow{color:rgba(246,245,249,.5);margin-bottom:10px}
.ti{display:flex;align-items:center;gap:12px;padding:9px 12px;border-radius:14px;border:1px solid transparent;transition:.25s}
.ti .n{width:28px;height:28px;border-radius:50%;display:grid;place-items:center;font-size:12px;font-weight:800;border:1.5px solid rgba(246,245,249,.25);color:rgba(246,245,249,.6);flex:none;transition:.25s}
.ti b{display:block;font-size:13.5px;font-weight:700;color:rgba(246,245,249,.7)}
.ti small{display:block;font-size:11.5px;color:rgba(246,245,249,.45);margin-top:1px}
.ti.cur{background:rgba(139,109,255,.4);border-color:rgba(228,221,255,.18)}
.ti.cur .n{background:var(--accent);border-color:var(--accent);color:#fff}
.ti.cur b{color:var(--cream)}
.ti.cur small{color:rgba(246,245,249,.7)}
.ti.done .n{background:var(--cream);border-color:var(--cream);color:var(--emerald)}
.ti.done b{color:rgba(246,245,249,.85)}
.hint{margin-top:18px;padding:14px 15px;border-radius:14px;background:rgba(246,245,249,.05);border:1px dashed rgba(246,245,249,.18)}
.hint .eyebrow{color:var(--accent-2)}
.hint p{font-size:12px;line-height:1.7;color:rgba(246,245,249,.78);margin-top:7px}
.hint p b{color:var(--cream);font-weight:700}
.pfoot{margin-top:auto;padding-top:22px;display:flex;align-items:center;justify-content:space-between;gap:12px}
.reset{display:inline-flex;align-items:center;gap:8px;border:1px solid rgba(246,245,249,.25);background:none;color:var(--cream);border-radius:12px;padding:9px 14px;font-size:12.5px;font-weight:600}
.reset:hover{background:rgba(246,245,249,.08)}
.pfoot small{font-size:10.5px;color:rgba(246,245,249,.45);text-align:right;line-height:1.5}

.stage{position:relative;display:grid;place-items:center;overflow:hidden;overflow:clip}
.stage::before{content:"";position:absolute;width:620px;height:620px;right:-240px;top:-300px;border-radius:50%;
  background:radial-gradient(circle,rgba(228,221,255,.9),rgba(228,221,255,0) 65%)}
.stage::after{content:"";position:absolute;width:520px;height:520px;left:-120px;bottom:-260px;border-radius:50%;
  background:radial-gradient(circle,rgba(255,230,238,.95),rgba(255,230,238,0) 65%)}
.devwrap{position:relative;z-index:1}
.frame{width:410px;height:864px;border-radius:58px;background:var(--deep);padding:10px;transform-origin:top left;position:relative;
  box-shadow:0 50px 80px -40px rgba(20,18,31,.55),0 8px 24px rgba(20,18,31,.15),inset 0 0 0 1.5px rgba(255,255,255,.06)}
.frame::before{content:"";position:absolute;right:-3px;top:190px;width:3px;height:74px;border-radius:0 3px 3px 0;background:#0E0C18}
.island{position:absolute;top:21px;left:50%;transform:translateX(-50%);width:118px;height:34px;border-radius:20px;background:#0E0C18;z-index:90;pointer-events:none}
.homebar{position:absolute;bottom:18px;left:50%;transform:translateX(-50%);width:128px;height:5px;border-radius:3px;background:var(--ink);opacity:.85;z-index:90;pointer-events:none}

/* ============ APP ============ */
.app{position:relative;height:100vh;height:100dvh;background:var(--paper);display:flex;flex-direction:column;overflow:hidden;--safe:env(safe-area-inset-bottom,0px)}
.sbar{height:52px;flex:none;display:flex;justify-content:space-between;align-items:center;padding:6px 30px 0 36px;font-weight:700;font-size:15px;position:relative;z-index:5}
.sbar .r{display:flex;align-items:center;gap:6px}
.bars{display:flex;gap:2px;align-items:flex-end}
.bars b{display:block;width:3px;background:var(--ink);border-radius:1px}
.bat{width:24px;height:12px;border-radius:4px;border:1.5px solid var(--ink);position:relative}
.bat::after{content:"";position:absolute;inset:1.5px 5px 1.5px 1.5px;background:var(--ink);border-radius:1.5px}
.view{flex:1;position:relative;min-height:0}
.scr{position:absolute;inset:0;display:flex;flex-direction:column}
.scr.in{animation:scrIn .34s cubic-bezier(.2,.7,.2,1)}
@keyframes scrIn{from{opacity:0;transform:translateX(16px)}to{opacity:1;transform:none}}
.scroll{flex:1;overflow-y:auto;overflow-x:hidden;scrollbar-width:none;overscroll-behavior:contain}
.scroll::-webkit-scrollbar{display:none}
.spacer{height:24px}

/* home */
.home-head{padding:8px 20px 0;display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
.home-head small{font-size:13px;color:var(--muted)}
.home-head h1{font-family:var(--serif);font-size:25px;font-weight:700;line-height:1.25;margin-top:2px}
.avatar{width:46px;height:46px;border-radius:50%;background:var(--accent-soft);color:var(--accent);font-weight:800;font-size:14px;display:grid;place-items:center;border:0;flex:none}
.search{margin:16px 20px 0;height:50px;border-radius:16px;background:var(--cream);display:flex;align-items:center;gap:10px;padding:0 8px 0 15px;color:var(--muted);font-size:18px;border:1.5px solid transparent;transition:.2s}
.search:focus-within{border-color:var(--emerald);background:#fff}
.search input{flex:1;min-width:0;border:0;background:transparent;font:inherit;font-size:14.5px;color:var(--ink);outline:none}
.search input::placeholder{color:var(--faint)}
.search .clr{width:32px;height:32px;border-radius:10px;border:0;background:none;color:var(--muted);display:grid;place-items:center;font-size:16px}
.cats{display:flex;gap:8px;overflow-x:auto;padding:16px 20px 4px;scrollbar-width:none}
.cats::-webkit-scrollbar{display:none}
.cat{flex:none;border:0;background:none;display:flex;flex-direction:column;align-items:center;gap:7px;font-size:11.5px;font-weight:600;color:var(--muted);min-width:62px}
.cat .c{width:56px;height:56px;border-radius:18px;background:var(--sage-soft);color:var(--emerald);display:grid;place-items:center;font-size:22px;transition:.2s}
.cat.on .c{background:var(--emerald);color:var(--cream);box-shadow:0 10px 18px -10px rgba(109,74,255,.8)}
.cat.on{color:var(--ink);font-weight:700}
.sec-h{display:flex;justify-content:space-between;align-items:baseline;padding:20px 20px 12px}
.sec-h h2{font-size:17px;font-weight:800}
.sec-h span{font-size:12.5px;color:var(--muted)}
.scard{margin:0 20px 14px;border-radius:24px;background:#fff;border:1px solid var(--line);overflow:hidden;cursor:pointer;transition:transform .15s,box-shadow .2s;box-shadow:0 14px 28px -22px rgba(20,18,31,.5)}
.scard:hover{box-shadow:0 18px 30px -20px rgba(20,18,31,.55)}
.scard:active{transform:scale(.985)}
.scard .art{height:146px;position:relative}
.art svg{width:100%;height:100%;display:block}
.chip-free{position:absolute;left:12px;top:12px;background:rgba(255,255,255,.95);color:var(--emerald);font-size:11.5px;font-weight:700;padding:5px 10px 5px 8px;border-radius:10px;display:flex;align-items:center;gap:6px}
.chip-free i{width:7px;height:7px;border-radius:50%;background:#3BAA7E;box-shadow:0 0 0 3px rgba(59,170,126,.2)}
.favbtn{position:absolute;right:12px;top:12px;width:38px;height:38px;border-radius:13px;background:rgba(255,255,255,.94);display:grid;place-items:center;color:var(--ink);font-size:18px;border:0;transition:transform .15s}
.favbtn:active{transform:scale(.88)}
.favbtn.on{color:var(--accent)}
.favbtn.on svg{fill:currentColor}
.scard .b{padding:13px 16px 15px}
.scard h3{font-size:16.5px;font-weight:800;display:flex;justify-content:space-between;align-items:center;gap:8px}
.rating{font-size:13px;font-weight:800;display:inline-flex;align-items:center;gap:4px;white-space:nowrap}
.rating svg{color:var(--gold)}
.rating small{font-weight:500;color:var(--muted);font-size:12px}
.meta{font-size:12.5px;color:var(--muted);display:flex;align-items:center;gap:6px;margin-top:5px;flex-wrap:wrap}
.meta .dotsep{width:3px;height:3px;border-radius:50%;background:var(--faint)}
.meta .ok{color:var(--emerald);font-weight:700}
.meta .no{color:var(--accent);font-weight:700}
.tags{display:flex;gap:6px;margin-top:10px;flex-wrap:wrap}
.tags span{font-size:11px;font-weight:600;padding:4px 9px;border-radius:8px;background:var(--cream);color:var(--muted)}
.empty{text-align:center;padding:48px 34px}
.empty .c{width:74px;height:74px;border-radius:24px;background:var(--sage-soft);color:var(--emerald);display:grid;place-items:center;font-size:30px;margin:0 auto}
.empty h3{font-family:var(--serif);font-size:19px;margin-top:16px}
.empty p{font-size:13px;color:var(--muted);margin-top:6px;line-height:1.6}
.empty .btn{margin-top:18px}

/* tabbar */
.tabbar{flex:none;display:flex;border-top:1px solid var(--line);background:rgba(255,255,255,.97);padding:9px 6px calc(var(--safe) + 8px)}
.tabbar button{flex:1;border:0;background:none;display:flex;flex-direction:column;align-items:center;gap:4px;font-size:11px;font-weight:600;color:var(--faint);position:relative}
.tabbar button svg{font-size:23px}
.tabbar button.on{color:var(--emerald);font-weight:700}
.badge{position:absolute;top:-4px;left:calc(50% + 5px);background:var(--accent);color:#fff;font-size:10px;font-weight:800;min-width:18px;height:18px;border-radius:9px;display:grid;place-items:center;padding:0 4px;border:2px solid var(--paper)}

/* salon */
.cover{height:250px;position:relative;flex:none}
.cover .top{position:absolute;top:12px;left:16px;right:16px;display:flex;justify-content:space-between}
.glass{width:42px;height:42px;border-radius:14px;background:rgba(255,255,255,.94);border:0;display:grid;place-items:center;font-size:19px;color:var(--ink);box-shadow:0 6px 14px rgba(0,0,0,.1)}
.glass.on{color:var(--accent)}
.glass.on svg{fill:currentColor}
.sinfo{margin:-38px 16px 0;position:relative;background:var(--paper);border-radius:24px;padding:18px 18px 16px;box-shadow:0 18px 30px -20px rgba(20,18,31,.45);border:1px solid var(--line)}
.sinfo h1{font-family:var(--serif);font-size:23px;font-weight:700;line-height:1.3}
.sinfo .meta{margin-top:7px}
.open{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:700;color:var(--emerald);background:var(--sage-soft);padding:5px 10px;border-radius:9px;margin-top:12px}
.open i{width:7px;height:7px;border-radius:50%;background:#3BAA7E}
.open.closed{color:var(--accent);background:var(--accent-soft)}
.open.closed i{background:var(--accent)}
.stabs{display:flex;gap:4px;margin:18px 20px 0;background:var(--cream);padding:4px;border-radius:15px}
.stabs button{flex:1;height:38px;border:0;border-radius:12px;background:none;font-size:13px;font-weight:700;color:var(--muted);transition:.2s}
.stabs button.on{background:var(--paper);color:var(--ink);box-shadow:0 2px 8px rgba(20,18,31,.08)}
.list{padding:4px 20px 8px}
.team{display:grid;grid-template-columns:1fr;gap:10px;padding:14px 20px 8px}
.trow{display:flex;align-items:center;gap:12px;padding:12px 14px;border:1px solid var(--line);border-radius:18px;background:#fff}
.trow .t{flex:1}
.trow b{display:block;font-size:14.5px}
.trow small{display:block;font-size:12px;color:var(--muted)}
.info{padding:14px 20px 8px}
.irow{display:flex;gap:12px;padding:12px 0;border-bottom:1px solid var(--line);align-items:flex-start}
.irow:last-child{border-bottom:0}
.irow .ic{width:36px;height:36px;border-radius:12px;background:var(--cream);display:grid;place-items:center;color:var(--emerald);font-size:16px;flex:none}
.irow b{display:block;font-size:12px;color:var(--muted);font-weight:600}
.irow span{display:block;font-size:14px;margin-top:2px;line-height:1.5}

/* service rows */
.svc{width:100%;display:flex;align-items:center;gap:12px;padding:13px 14px;border-radius:17px;border:1.5px solid var(--line);background:#fff;margin-top:10px;text-align:left;transition:border-color .15s,background .15s}
.svc:hover{border-color:#D3D0DD}
.svc.on{border-color:var(--emerald);background:var(--sage-soft)}
.cb{width:23px;height:23px;border-radius:8px;border:1.8px solid #D3D0DD;display:grid;place-items:center;color:#fff;flex:none;font-size:14px;transition:.15s;background:#fff}
.cb svg{opacity:0;stroke-width:3.2;transform:scale(.6);transition:.18s}
.on .cb{background:var(--emerald);border-color:var(--emerald)}
.on .cb svg{opacity:1;transform:none}
.svc .t{flex:1;min-width:0}
.svc .t b{display:block;font-size:14.5px;font-weight:700}
.svc .t small{font-size:12px;color:var(--muted);display:flex;align-items:center;gap:4px;margin-top:3px}
.svc .p{font-size:15px;font-weight:800;color:var(--emerald);white-space:nowrap}

/* footer */
.foot{flex:none;padding:12px 20px calc(var(--safe) + 14px);border-top:1px solid var(--line);background:var(--paper)}
.foot .sum{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:10px;font-size:12.5px;color:var(--muted)}
.foot .sum b{font-size:20px;color:var(--ink);font-weight:800}
.btn{width:100%;height:54px;border-radius:17px;border:0;background:var(--emerald);color:var(--cream);font-size:15.5px;font-weight:700;display:flex;align-items:center;justify-content:center;gap:9px;transition:background .2s,transform .12s}
.btn:hover:not(:disabled){background:#5A37EE}
.btn:active:not(:disabled){transform:scale(.985)}
.btn:disabled{background:#CFCCD8;color:#fff;cursor:not-allowed}
.btn.ghost{background:var(--cream);color:var(--ink)}
.btn.ghost:hover{background:var(--sand)}
.btn.sm{height:46px;font-size:14px;border-radius:14px}
.btn.accent{background:var(--accent)}
.btn.accent:hover{background:#E84676}
.spin{width:18px;height:18px;border-radius:50%;border:2.5px solid rgba(246,245,249,.35);border-top-color:var(--cream);animation:spin .7s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}

/* booking */
.bk-head{display:flex;align-items:center;justify-content:space-between;padding:4px 16px 0;height:50px;flex:none}
.icon-btn{width:42px;height:42px;border-radius:14px;background:var(--cream);border:0;display:grid;place-items:center;font-size:19px;color:var(--ink)}
.icon-btn:hover{background:var(--sand)}
.bk-head strong{font-family:var(--serif);font-size:18px;font-weight:700}
.prog{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;padding:12px 20px 0;flex:none}
.prog i{display:block;height:4px;border-radius:3px;background:var(--sand);transition:background .3s}
.prog .done i,.prog .on i{background:var(--emerald)}
.prog span{display:block;font-size:11px;color:var(--faint);margin-top:7px;font-weight:600}
.prog .on span{color:var(--emerald);font-weight:800}
.prog .done span{color:var(--ink)}
.smini{margin:16px 20px 0;display:flex;align-items:center;gap:12px;background:var(--cream);border-radius:17px;padding:9px}
.smini .th{width:46px;height:46px;border-radius:13px;overflow:hidden;flex:none}
.smini .th svg{width:100%;height:100%;display:block}
.smini b{display:block;font-size:14px}
.smini small{display:block;font-size:12px;color:var(--muted);margin-top:1px}
.st{font-family:var(--serif);font-size:21px;font-weight:700;padding:22px 20px 0}
.ss{font-size:13px;color:var(--muted);padding:4px 20px 2px}
.mst{width:100%;display:flex;align-items:center;gap:12px;padding:12px 14px;border-radius:19px;border:1.5px solid var(--line);background:#fff;margin-top:10px;text-align:left;transition:border-color .15s,background .15s}
.mst:hover:not(:disabled){border-color:#D3D0DD}
.mst.on{border-color:var(--emerald);background:var(--sage-soft)}
.mst:disabled{opacity:.5;cursor:not-allowed}
.mst.any{border-style:dashed;border-color:#D3D0DD}
.mst.any.on{border-style:solid;border-color:var(--emerald)}
.av{width:50px;height:50px;border-radius:50%;display:grid;place-items:center;font-weight:800;font-size:15px;flex:none}
.mst .t{flex:1;min-width:0}
.mst .t b{font-size:15px;font-weight:700;display:block}
.mst .t small{font-size:12px;color:var(--muted);display:block;margin-top:1px}
.mst .rating{font-size:12px;margin-top:3px}
.nextc{display:inline-flex;align-items:center;gap:4px;margin-top:6px;font-size:11.5px;font-weight:700;color:var(--accent);background:var(--accent-soft);padding:3px 8px;border-radius:7px}
.nope{display:inline-block;margin-top:5px;font-size:11.5px;color:var(--muted);font-weight:600}
.radio{width:23px;height:23px;border-radius:50%;border:1.8px solid #D3D0DD;flex:none;transition:.15s;background:#fff}
.on .radio{border:7px solid var(--emerald)}
.dates{position:relative;display:flex;gap:8px;overflow-x:auto;padding:12px 20px 6px;scrollbar-width:none;scroll-behavior:smooth}
.dates::-webkit-scrollbar{display:none}
.d{flex:none;width:58px;padding:9px 0 9px;border-radius:17px;border:1.5px solid var(--line);background:#fff;text-align:center;transition:.15s}
.d small{display:block;font-size:11px;color:var(--muted);font-weight:600}
.d b{display:block;font-size:20px;font-weight:800;line-height:1.35}
.d .dot{display:block;width:5px;height:5px;border-radius:50%;background:#3BAA7E;margin:3px auto 0}
.d.full .dot{background:var(--accent)}
.d.on{background:var(--emerald);border-color:var(--emerald);color:var(--cream)}
.d.on small{color:rgba(246,245,249,.8)}
.d.on .dot{background:var(--accent-2)}
.d:disabled{opacity:.45;cursor:not-allowed;background:var(--cream);border-color:transparent}
.d:disabled .dot{background:transparent}
.dur{display:flex;align-items:center;gap:6px;font-size:13px;color:var(--muted);padding:5px 20px 0}
.dur b{color:var(--ink)}
.tgroup{padding:16px 20px 0}
.tgroup h4{font-size:12.5px;font-weight:700;color:var(--muted);display:flex;align-items:center;gap:7px;margin-bottom:9px}
.tgroup h4 svg{font-size:15px}
.times{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.tm{height:44px;border-radius:13px;border:1.5px solid var(--line);background:#fff;font-size:14px;font-weight:700;transition:.15s}
.tm:hover:not(:disabled){border-color:var(--emerald)}
.tm.on{background:var(--emerald);border-color:var(--emerald);color:var(--cream)}
.tm:disabled{background:var(--cream);border-color:transparent;color:#B3B0BF;text-decoration:line-through;cursor:not-allowed}
.nofree{margin:18px 20px 0;padding:18px;border-radius:18px;background:var(--cream);text-align:center;font-size:13px;color:var(--muted);line-height:1.6}
.nofree b{display:block;color:var(--ink);font-size:14.5px;margin-bottom:2px}

/* confirm */
.card{margin:14px 20px 0;background:#fff;border:1px solid var(--line);border-radius:22px;padding:16px}
.when{display:flex;gap:14px;align-items:center}
.calb{width:58px;height:62px;border-radius:16px;background:var(--emerald);color:var(--cream);text-align:center;display:flex;flex-direction:column;justify-content:center;flex:none}
.calb small{font-size:11px;opacity:.8;font-weight:600}
.calb b{font-size:22px;line-height:1.1;font-weight:800}
.when .t b{display:block;font-size:15px}
.when .t span{display:block;font-size:13px;color:var(--muted);margin-top:2px}
.hr{height:1px;background:var(--line);margin:14px 0}
.who{display:flex;align-items:center;gap:10px;font-size:14px}
.who .av{width:36px;height:36px;font-size:12px}
.who small{display:block;font-size:12px;color:var(--muted)}
.ln{display:flex;justify-content:space-between;font-size:14px;padding:5px 0;gap:10px}
.ln span:last-child{font-weight:700;white-space:nowrap}
.ln small{color:var(--muted);font-size:12px}
.total{border-top:1px dashed #D3D0DD;margin-top:8px;padding-top:11px;display:flex;justify-content:space-between;font-weight:800;font-size:16px}
.total span:last-child{color:var(--emerald)}
.card h5{font-size:13px;font-weight:800;margin-bottom:12px;display:flex;align-items:center;gap:7px}
.card h5 svg{color:var(--emerald);font-size:16px}
.field{margin-top:10px}
.field:first-of-type{margin-top:0}
.field label{display:block;font-size:12px;font-weight:700;color:var(--muted);margin-bottom:6px}
.inp{display:flex;align-items:center;height:48px;border-radius:14px;border:1.5px solid var(--line);background:var(--paper);transition:.15s;overflow:hidden}
.inp:focus-within{border-color:var(--emerald);background:#fff}
.inp .pre{padding:0 4px 0 14px;font-size:14.5px;color:var(--muted);font-weight:600}
.inp input,.inp textarea{flex:1;min-width:0;height:100%;border:0;background:none;padding:0 14px;font:inherit;font-size:14.5px;color:var(--ink);outline:none}
.inp.ta{height:auto}
.inp textarea{height:70px;padding:12px 14px;resize:none}
.field.err .inp{border-color:var(--accent);background:#FFF4F6}
.errmsg{font-size:11.5px;color:var(--accent);margin-top:5px;font-weight:600}
.opt{display:flex;align-items:center;gap:12px;margin-top:14px}
.opt .t{flex:1}
.opt b{display:block;font-size:13.5px}
.opt small{display:block;font-size:12px;color:var(--muted)}
.tog{width:48px;height:28px;border-radius:15px;background:#D3D0DD;border:0;position:relative;flex:none;transition:.2s}
.tog::after{content:"";position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:#fff;box-shadow:0 2px 4px rgba(0,0,0,.15);transition:.2s}
.tog.on{background:var(--emerald)}
.tog.on::after{left:23px}
.note{display:flex;gap:10px;margin:14px 20px 0;padding:12px 14px;border-radius:16px;background:var(--accent-soft);font-size:12.5px;line-height:1.55;color:#8A2246}
.note svg{font-size:17px;color:var(--accent);margin-top:1px}

/* success */
.succ{padding:24px 22px 10px;text-align:center}
.bigcheck{width:100px;height:100px;border-radius:50%;background:var(--emerald);color:var(--cream);display:grid;place-items:center;margin:14px auto 0;font-size:48px;position:relative;animation:pop .6s cubic-bezier(.2,1.4,.4,1)}
.bigcheck svg{stroke-width:2.6;stroke-dasharray:30;stroke-dashoffset:30;animation:draw .5s .3s forwards}
.bigcheck::before,.bigcheck::after{content:"";position:absolute;inset:-12px;border-radius:50%;border:2px solid var(--sage);animation:ring 1.8s .4s ease-out infinite}
.bigcheck::after{animation-delay:1.3s}
@keyframes pop{from{transform:scale(.3);opacity:0}}
@keyframes draw{to{stroke-dashoffset:0}}
@keyframes ring{from{transform:scale(.9);opacity:.9}to{transform:scale(1.35);opacity:0}}
.succ h1{font-family:var(--serif);font-size:25px;margin-top:26px;line-height:1.3}
.succ p{font-size:13.5px;color:var(--muted);margin-top:8px;line-height:1.6}
.ticket{margin:22px 20px 0;background:#fff;border:1px solid var(--line);border-radius:22px;padding:16px 18px;text-align:left;position:relative}
.ticket .code{display:flex;justify-content:space-between;align-items:center}
.ticket .code small{font-size:12px;color:var(--muted)}
.ticket .code b{font-size:16px;letter-spacing:.06em;color:var(--emerald)}
.ticket .cut{position:relative;height:1px;border-top:1.5px dashed #D3D0DD;margin:14px -18px}
.ticket .cut::before,.ticket .cut::after{content:"";position:absolute;top:-11px;width:20px;height:20px;border-radius:50%;background:var(--paper);border:1px solid var(--line)}
.ticket .cut::before{left:-10px;clip-path:inset(0 0 0 50%)}
.ticket .cut::after{right:-10px;clip-path:inset(0 50% 0 0)}
.kv{display:flex;justify-content:space-between;font-size:13.5px;padding:5px 0;gap:14px}
.kv span:first-child{color:var(--muted)}
.kv span:last-child{font-weight:700;text-align:right}
.acts{padding:18px 20px 0;display:grid;gap:10px}
.link{border:0;background:none;color:var(--emerald);font-weight:700;font-size:13.5px;display:inline-flex;align-items:center;gap:7px;margin:16px auto 0}

/* bookings */
.ptitle{font-family:var(--serif);font-size:25px;font-weight:700;padding:10px 20px 0}
.segm{display:flex;gap:4px;margin:16px 20px 0;background:var(--cream);padding:4px;border-radius:15px}
.segm button{flex:1;height:38px;border:0;border-radius:12px;background:none;font-size:13px;font-weight:700;color:var(--muted)}
.segm button.on{background:var(--paper);color:var(--ink);box-shadow:0 2px 8px rgba(20,18,31,.08)}
.bcard{margin:12px 20px 0;background:#fff;border:1px solid var(--line);border-radius:22px;padding:14px;animation:scrIn .3s}
.bcard .top{display:flex;gap:13px}
.datebox{width:56px;flex:none;border-radius:15px;background:var(--sage-soft);color:var(--emerald);text-align:center;padding:8px 0}
.datebox small{display:block;font-size:11px;font-weight:700}
.datebox b{display:block;font-size:22px;font-weight:800;line-height:1.2}
.past .datebox{background:var(--cream);color:var(--muted)}
.bcard .t{flex:1;min-width:0}
.bcard .t b{display:block;font-size:15px}
.bcard .t span{display:block;font-size:12.5px;color:var(--muted);margin-top:2px;line-height:1.5}
.status{display:inline-flex;align-items:center;gap:5px;font-size:11px;font-weight:700;padding:3px 8px;border-radius:7px;margin-top:7px;background:var(--sage-soft);color:var(--emerald)}
.status.done{background:var(--cream);color:var(--muted)}
.status.cancel{background:var(--accent-soft);color:var(--accent)}
.bacts{display:flex;gap:8px;margin-top:12px}
.bacts button{flex:1;height:40px;border-radius:12px;border:1.5px solid var(--line);background:var(--paper);font-size:13px;font-weight:700;display:flex;align-items:center;justify-content:center;gap:6px}
.bacts button:hover{background:var(--cream)}
.bacts .danger{color:var(--accent)}

/* profile */
.pcard{margin:16px 20px 0;display:flex;align-items:center;gap:14px;padding:16px;border-radius:22px;background:var(--emerald);color:var(--cream)}
.pcard .avatar{width:58px;height:58px;font-size:18px;background:var(--cream);color:var(--emerald)}
.pcard b{display:block;font-size:17px}
.pcard small{display:block;font-size:13px;opacity:.75;margin-top:2px}
.menu{margin:14px 20px 0;background:#fff;border:1px solid var(--line);border-radius:20px;overflow:hidden}
.mi{width:100%;display:flex;align-items:center;gap:12px;padding:14px 16px;border:0;border-bottom:1px solid var(--line);background:none;text-align:left;font-size:14.5px}
.mi:last-child{border-bottom:0}
.mi:hover{background:var(--paper)}
.mi .ic{width:36px;height:36px;border-radius:12px;background:var(--cream);display:grid;place-items:center;color:var(--emerald);font-size:17px;flex:none}
.mi .t{flex:1}
.mi .v{font-size:13px;color:var(--muted)}
.mi .chev{color:var(--faint);font-size:16px}
.ver{text-align:center;font-size:11.5px;color:var(--faint);margin-top:18px}

/* overlays */
.toast{position:absolute;left:50%;bottom:112px;transform:translateX(-50%);background:var(--ink);color:var(--cream);padding:11px 16px;border-radius:15px;font-size:13px;font-weight:600;z-index:80;white-space:nowrap;display:flex;align-items:center;gap:8px;box-shadow:0 12px 24px -12px rgba(0,0,0,.4);animation:toastIn .3s cubic-bezier(.2,.8,.2,1)}
.toast svg{color:var(--accent-2);font-size:16px}
.toast.out{animation:toastOut .25s forwards}
@keyframes toastIn{from{opacity:0;transform:translate(-50%,12px)}}
@keyframes toastOut{to{opacity:0;transform:translate(-50%,8px)}}
.ov{position:absolute;inset:0;background:rgba(14,12,24,.45);z-index:70;display:flex;align-items:flex-end;animation:fade .2s}
@keyframes fade{from{opacity:0}}
.sheet{background:var(--paper);width:100%;border-radius:28px 28px 0 0;padding:10px 20px calc(var(--safe) + 18px);animation:up .3s cubic-bezier(.2,.8,.2,1)}
@keyframes up{from{transform:translateY(100%)}}
.sheet .grab{width:40px;height:5px;border-radius:3px;background:var(--sand);margin:0 auto 18px}
.sheet .c{width:58px;height:58px;border-radius:19px;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center;font-size:26px}
.sheet h3{font-family:var(--serif);font-size:20px;margin-top:14px}
.sheet p{font-size:13.5px;color:var(--muted);margin-top:6px;line-height:1.6}
.sheet .row{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:20px}
.notif{position:absolute;top:56px;left:10px;right:10px;z-index:85;background:rgba(255,255,255,.98);border-radius:22px;padding:12px 14px;display:flex;gap:12px;align-items:center;border:1px solid var(--line);
  box-shadow:0 18px 34px -14px rgba(20,18,31,.45),0 3px 8px rgba(20,18,31,.1);animation:nIn .5s cubic-bezier(.2,1.2,.3,1)}
.notif.out{animation:nOut .35s forwards}
@keyframes nIn{from{transform:translateY(-130%);opacity:0}}
@keyframes nOut{to{transform:translateY(-130%);opacity:0}}
.notif .c{width:40px;height:40px;border-radius:12px;background:var(--emerald);color:var(--cream);display:grid;place-items:center;font-size:22px;flex:none}
.notif .t{flex:1;min-width:0}
.notif .t b{display:block;font-size:13.5px}
.notif .t span{display:block;font-size:12.5px;color:var(--muted);margin-top:1px}
.notif .when{position:absolute;right:14px;top:11px;font-size:11px;color:var(--faint)}

/* ============ phone: full-screen app ============ */
.topnav{display:none}
.app .view{padding-top:env(safe-area-inset-top,0px)}

}

/* ===================== date helpers ===================== */
const DAY_S = ['კვი','ორშ','სამ','ოთხ','ხუთ','პარ','შაბ'];
const DAY_F = ['კვირა','ორშაბათი','სამშაბათი','ოთხშაბათი','ხუთშაბათი','პარასკევი','შაბათი'];
const MON_S = ['იან','თებ','მარ','აპრ','მაი','ივნ','ივლ','აგვ','სექ','ოქტ','ნოე','დეკ'];
const MON_F = ['იანვარი','თებერვალი','მარტი','აპრილი','მაისი','ივნისი','ივლისი','აგვისტო','სექტემბერი','ოქტომბერი','ნოემბერი','დეკემბერი'];
const pad = n => String(n).padStart(2, '0');
const keyOf = d => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
const fromKey = k => { const [y, m, d] = k.split('-').map(Number); return new Date(y, m - 1, d); };
const addDays = (d, n) => { const x = new Date(d); x.setDate(x.getDate() + n); return x; };
const today0 = () => { const d = new Date(); d.setHours(0, 0, 0, 0); return d; };
const nowMin = () => { const d = new Date(); return d.getHours() * 60 + d.getMinutes(); };
const hm = m => `${Math.floor(m / 60)}:${pad(m % 60)}`;
const fmtDur = m => m < 60 ? `${m} წთ` : (m % 60 ? `${Math.floor(m / 60)} სთ ${m % 60} წთ` : `${m / 60} სთ`);
const money = n => `${n} ₾`;
const DAYS = () => Array.from({ length: 14 }, (_, i) => addDays(today0(), i));
function relDay(k) {
  const t = keyOf(today0()), tm = keyOf(addDays(today0(), 1));
  if (k === t) return 'დღეს';
  if (k === tm) return 'ხვალ';
  const d = fromKey(k); return `${DAY_S[d.getDay()]}, ${d.getDate()} ${MON_S[d.getMonth()]}`;
}
const longDate = k => { const d = fromKey(k); return `${DAY_F[d.getDay()]}, ${d.getDate()} ${MON_F[d.getMonth()]}`; };
const esc = s => String(s).replace(/[&<>"']/g, c => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[c]));

/* ============ predefined availability (deterministic, no backend) ============ */
function hash(str) { let h = 2166136261; for (let i = 0; i < str.length; i++) { h ^= str.charCodeAt(i); h = Math.imul(h, 16777619); } return h >>> 0; }
function cellBusy(mid, key, m) {
  const i = m / 30;
  return hash(`${mid}|${key}|${Math.floor(i / 2)}`) % 100 < 24 || hash(`${mid}|${key}|${i}|s`) % 100 < 9;
}
const salonById = id => SALONS.find(s => s.id === id);
const svcById = (s, id) => s.services.find(v => v.id === id);
const masterById = (s, id) => s.masters.find(m => m.id === id);
function isClosedDay(s, key) { return s.closed.includes(fromKey(key).getDay()); }
function masterFree(s, mid, key, start, dur) {
  if (isClosedDay(s, key)) return false;
  const end = start + dur;
  if (start < s.open || end > s.close) return false;
  if (key === keyOf(today0()) && start < nowMin() + 30) return false;
  for (let m = start; m < end; m += 30) if (cellBusy(mid, key, m)) return false;
  // bookings made in this demo session block the slot too
  for (const b of state.bookings) {
    if (b.status !== 'up' || b.masterId !== mid || b.date !== key) continue;
    if (start < b.time + b.dur && b.time < end) return false;
  }
  return true;
}
const eligible = (s, svc) => s.masters.filter(m => svc.every(id => m.does.includes(id)));
const totals = (s, svc) => svc.reduce((a, id) => { const v = svcById(s, id); a.min += v.min; a.price += v.price; return a; }, { min: 0, price: 0 });
const slotDur = min => Math.max(30, Math.ceil(min / 30) * 30);
function slots(s, mids, key, min) {
  const dur = slotDur(min), out = [];
  for (let t = s.open; t + 30 <= s.close; t += 30) {
    const free = mids.find(id => masterFree(s, id, key, t, dur));
    out.push({ t, mid: free || null });
  }
  return out;
}
function nextAvail(s, mids, min) {
  for (const d of DAYS()) { const k = keyOf(d); const f = slots(s, mids, k, min).find(x => x.mid); if (f) return { key: k, t: f.t }; }
  return null;
}
function openStatus(s) {
  const d = new Date(), k = keyOf(d), m = nowMin();
  if (isClosedDay(s, k)) return { ok: false, text: `დღეს დაკეტილია` };
  if (m < s.open) return { ok: false, text: `დაკეტილია · გაიხსნება ${hm(s.open)}-ზე` };
  if (m >= s.close) return { ok: false, text: `დაკეტილია · ხვალ ${hm(s.open)}-დან` };
  return { ok: true, text: `ღიაა · ${hm(s.close)}-მდე` };
}
const freeToday = s => slots(s, s.masters.map(m => m.id), keyOf(today0()), 30).some(x => x.mid);
const hoursText = s => s.closed.length ? `ორშ–შაბ · ${hm(s.open)}–${hm(s.close)}` : `ყოველდღე · ${hm(s.open)}–${hm(s.close)}`;

/* ===================== render ===================== */
const VIEWS = { home: vHome, salon: vSalon, book: vBook, success: vSuccess, bookings: vBookings, favs: vFavs, profile: vProfile };
let lastKey = null;
function render() {
  const key = state.view + (state.view === 'book' ? state.step : '') + (state.view === 'salon' ? state.salonId : '');
  const viewEl = document.getElementById('view');
  const old = viewEl.querySelector('.scroll'), oldDates = viewEl.querySelector('#dates');
  const keep = key === lastKey ? { top: old ? old.scrollTop : 0, left: oldDates ? oldDates.scrollLeft : 0 } : null;
  viewEl.innerHTML = `<div class="scr ${keep ? '' : 'in'}">${VIEWS[state.view]()}</div>`;
  if (keep) {
    const sc = viewEl.querySelector('.scroll'); if (sc) sc.scrollTop = keep.top;
    const ds = viewEl.querySelector('#dates'); if (ds) { ds.style.scrollBehavior = 'auto'; ds.scrollLeft = keep.left; ds.style.scrollBehavior = ''; }
  } else {
    const ds = viewEl.querySelector('#dates .on');
    if (ds) { const p = ds.parentElement; p.style.scrollBehavior = 'auto'; p.scrollLeft = Math.max(0, ds.offsetLeft - p.clientWidth / 2 + ds.offsetWidth / 2); p.style.scrollBehavior = ''; }
  }
  lastKey = key;
  const tb = document.getElementById('tabbar');
  const showTabs = ['home', 'bookings', 'favs', 'profile'].includes(state.view);
  tb.style.display = showTabs ? '' : 'none';
  if (showTabs) tb.innerHTML = tabbar();
  document.getElementById('topnav').innerHTML = topnav();
}
function topnav() {
  const up = state.bookings.filter(b => b.status === 'up').length;
  const cur = ['home', 'bookings', 'favs', 'profile'].includes(state.view) ? state.view : (state.view === 'success' ? '' : 'home');
  const T = [['home', 'მთავარი', 'home'], ['bookings', 'ჯავშნები', 'cal'], ['favs', 'რჩეულები', 'heart']];
  return `<button class="brand" data-a="tab" data-t="home"><span class="mark">${ic('logo', 'f')}</span><b>ჩაეწერე</b></button>
    <nav>${T.map(([k, t, i]) => `<button class="${cur === k ? 'on' : ''}" data-a="tab" data-t="${k}">${ic(i)}${t}${k === 'bookings' && up ? `<span class="badge">${up}</span>` : ''}</button>`).join('')}</nav>
    <button class="me" data-a="tab" data-t="profile"><span class="avatar">${USER.initials}</span>${USER.first}</button>`;
}

function updateTrack() {
  let cur = 1, allDone = false;
  if (state.view === 'book') cur = state.step + 1;
  if (state.view === 'success') allDone = true;
  document.querySelectorAll('#track .ti').forEach(el => {
    const n = +el.dataset.s;
    el.classList.toggle('done', allDone || n < cur);
    el.classList.toggle('cur', !allDone && n === cur);
  });
}

  t.className = 'toast'; t.innerHTML = `${ic(icon)}${text}`;

  setTimeout(() => { t.classList.add('out'); setTimeout(() => t.remove(), 260); }, 2200);
}

function notify(title, text) {

/* ===================== actions (predefined behaviour) ===================== */
// scroll the app's own list (not the page) so a scaled phone frame never shifts
function scrollToEl(el) {
  if (!el) return;
  const sc = el.closest('.scroll'); if (!sc) return;
  const k = sc.getBoundingClientRect().height / sc.offsetHeight || 1;
  const dy = (el.getBoundingClientRect().top - sc.getBoundingClientRect().top) / k;
  sc.scrollTo({ top: sc.scrollTop + dy - sc.clientHeight / 3, behavior: 'smooth' });
}
function go(view) { state.view = view; if (['home', 'bookings', 'favs', 'profile'].includes(view)) state.tab = view; render(); }
function startBooking(salonId, svc = [], master = null, from = 'salon') {
  state.bk = { salonId, svc: [...svc], master, date: null, time: null, name: USER.name, phone: USER.phone, comment: '', sms: true, err: {}, loading: false, from };
  state.step = 1; go('book');
}
function ensureDate() {
  const b = state.bk, s = salonById(b.salonId), tot = totals(s, b.svc);
  const mids = b.master === 'any' ? eligible(s, b.svc).map(m => m.id) : [b.master];
  const has = k => !isClosedDay(s, k) && slots(s, mids, k, tot.min).some(x => x.mid);
  if (!b.date || !has(b.date)) { const f = DAYS().map(keyOf).find(has); b.date = f || keyOf(today0()); b.time = null; }
}
function leaveBooking() { const b = state.bk; if (b.from === 'salon') { state.salonId = b.salonId; go('salon'); } else go(state.tab || 'home'); }

let notifTimer = null;
const A = {
  tab: el => go(el.dataset.t),
  cat: el => { state.cat = el.dataset.id; render(); },
  clearQ: () => { state.q = ''; render(); document.getElementById('q')?.focus(); },
  openSalon: el => { state.salonId = el.dataset.id; state.salonTab = 'services'; state.pre = new Set(); go('salon'); },
  fav: el => {
    const id = el.dataset.id;
    if (state.favs.has(id)) { state.favs.delete(id); toast('წაიშალა რჩეულებიდან', 'heart'); } else { state.favs.add(id); toast('დაემატა რჩეულებში', 'heart'); }
    render();
  },
  back: () => go(state.tab || 'home'),
  salonTab: el => { state.salonTab = el.dataset.t; render(); },
  preSvc: el => { const id = el.dataset.id; state.pre.has(id) ? state.pre.delete(id) : state.pre.add(id); render(); },
  startBook: () => startBooking(state.salonId, [...state.pre], null, 'salon'),
  bkBack: () => { if (state.step > 1) { state.step--; render(); } else leaveBooking(); },
  bkClose: () => leaveBooking(),
  toggleSvc: el => {
    const b = state.bk, id = el.dataset.id;
    b.svc = b.svc.includes(id) ? b.svc.filter(x => x !== id) : [...b.svc, id];
    const s = salonById(b.salonId);
    if (b.master && b.master !== 'any' && !eligible(s, b.svc).some(m => m.id === b.master)) b.master = null;
    b.time = null; render();
  },
  pickMaster: el => { state.bk.master = el.dataset.id; state.bk.time = null; render(); },
  pickDate: el => { state.bk.date = el.dataset.k; state.bk.time = null; render(); },
  pickTime: el => { state.bk.time = +el.dataset.t; render(); },
  next: () => {
    const b = state.bk, s = salonById(b.salonId);
    if (state.step === 1) {
      if (!eligible(s, b.svc).length) { toast('ეს სერვისები ერთ მასტერთან ერთად ვერ დაიჯავშნება', 'info'); return; }
      if (eligible(s, b.svc).length === 1 && !b.master) b.master = eligible(s, b.svc)[0].id;
    }
    if (state.step === 2) ensureDate();
    state.step++; render();
  },
  toggleSms: () => { state.bk.sms = !state.bk.sms; render(); },
  confirm: () => {
    const b = state.bk, s = salonById(b.salonId), tot = totals(s, b.svc);
    b.err = { name: !b.name.trim(), phone: !/^5\d{8}$/.test(b.phone.replace(/\s/g, '')) };
    if (b.err.name || b.err.phone) { render(); scrollToEl(document.querySelector('.field.err')); return; }
    b.loading = true; render();
    setTimeout(() => {
      const mids = b.master === 'any' ? eligible(s, b.svc).map(m => m.id) : [b.master];
      const mid = mids.find(id => masterFree(s, id, b.date, b.time, slotDur(tot.min))) || mids[0];
      const p = b.phone.replace(/\s/g, '');
      const bk = { id: 'b' + (++state.seq), code: 'CH-' + state.seq, salonId: s.id, svc: [...b.svc], masterId: mid, date: b.date, time: b.time,
        dur: tot.min, price: tot.price, status: 'up', sms: b.sms, phone: `${p.slice(0, 3)} ${p.slice(3, 5)} ${p.slice(5, 7)} ${p.slice(7)}` };
      state.bookings.push(bk); state.last = bk; state.bk = null; state.bTab = 'up';
      go('success');
      notifTimer = setTimeout(() => notify('ჯავშანი დადასტურებულია', `${relDay(bk.date)} · ${hm(bk.time)} · ${s.name}`), 1500);
    }, 1100);
  },
  goBookings: () => { state.bTab = 'up'; go('bookings'); },
  goHome: () => go('home'),
  addCal: () => toast('დაემატა კალენდარში', 'calplus'),
  bTab: el => { state.bTab = el.dataset.t; render(); },
  route: () => toast('რუკა გაიხსნება მომდევნო ვერსიაში', 'nav'),
  cancelB: el => {
    const bk = state.bookings.find(b => b.id === el.dataset.id), s = salonById(bk.salonId);
    sheet(`<div class="c">${ic('cal')}</div><h3>გავაუქმოთ ჯავშანი?</h3>
      <p>${s.name} · ${relDay(bk.date)}, ${hm(bk.time)}. სალონი მიიღებს შეტყობინებას და დრო გათავისუფლდება.</p>
      <div class="row"><button class="btn ghost sm" data-a="closeSheet">არა, დატოვება</button><button class="btn accent sm" data-a="doCancel" data-id="${bk.id}">დიახ, გაუქმება</button></div>`);
  },
  doCancel: el => { const bk = state.bookings.find(b => b.id === el.dataset.id); bk.status = 'cancelled'; closeSheet(); render(); toast('ჯავშანი გაუქმდა', 'x'); },
  closeSheet: () => closeSheet(),
  rebook: el => { const bk = state.bookings.find(b => b.id === el.dataset.id); startBooking(bk.salonId, bk.svc, bk.masterId, 'tab'); },
  toggleNotif: () => { state.notif = !state.notif; render(); toast(state.notif ? 'შეტყობინებები ჩართულია' : 'შეტყობინებები გამორთულია', 'bell'); },
  nyi: () => toast('ეს ფუნქცია MVP-ში არ შედის', 'info'),
  reset: () => { clearTimeout(notifTimer); closeSheet(); document.querySelectorAll('.notif,.toast').forEach(n => n.remove()); state = initialState(); lastKey = null; render(); },
};

document.addEventListener('click', e => {
  const el = e.target.closest('[data-a]');
  if (!el || el.disabled) return;
  if (el.classList.contains('ov') && e.target !== el) return; // tap inside sheet ≠ tap on backdrop
  const fn = A[el.dataset.a];
  if (fn) { e.preventDefault(); fn(el); }
});
document.addEventListener('input', e => {
  const t = e.target;
  if (t.id === 'q') {
    state.q = t.value;
    document.getElementById('salonList').innerHTML = salonListHTML();
    document.getElementById('cnt').textContent = `${filteredSalons().length} სალონი`;
    const lab = t.closest('.search'); const has = lab.querySelector('.clr');
    if (state.q && !has) lab.insertAdjacentHTML('beforeend', `<button class="clr" data-a="clearQ">${ic('x')}</button>`);
    if (!state.q && has) has.remove();
  }
  if (t.dataset.f && state.bk) {
    state.bk[t.dataset.f] = t.value;
    if (state.bk.err[t.dataset.f]) { state.bk.err[t.dataset.f] = false; const f = t.closest('.field'); f.classList.remove('err'); f.querySelector('.errmsg')?.remove(); }
  }
});

/* Mtavruli (Georgian capitals) for small eyebrow labels */
document.querySelectorAll('.mt').forEach(el => {
  const w = document.createTreeWalker(el, NodeFilter.SHOW_TEXT); let n;
  while ((n = w.nextNode())) n.nodeValue = n.nodeValue.replace(/[ა-ჺ]/g, c => String.fromCharCode(c.charCodeAt(0) + 0x0BC0));
});

render();
</script>
</body>
</html>
