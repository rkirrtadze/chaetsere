<!doctype html>
<html lang="ka"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>ჩაეწერე</title>
<style>
:root{--ink:#14121F;--em:#6D4AFF;--cream:#F6F5F9;--paper:#FFFFFF;--line:#E7E5EE;--muted:#6E6A7C;--acc:#FF5C8A}
*{box-sizing:border-box;margin:0}
body{font-family:'Noto Sans Georgian',system-ui,sans-serif;background:var(--cream);color:var(--ink);min-height:100vh;display:grid;place-items:center;padding:24px 16px}
main{width:100%;max-width:640px}
h1{font-size:30px;line-height:1.3}
p{color:var(--muted);margin-top:8px;line-height:1.6}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:14px;margin-top:24px}
a{display:block;text-decoration:none;color:inherit;background:var(--paper);border:1px solid var(--line);border-radius:20px;padding:20px;transition:border-color .15s}
a:hover{border-color:var(--em)}
a b{display:block;font-size:17px}
a span{display:block;color:var(--muted);font-size:13.5px;margin-top:6px;line-height:1.5}
a i{display:inline-block;margin-top:14px;font-style:normal;font-weight:700;color:var(--em)}
small{display:block;margin-top:22px;color:var(--muted);font-size:12px}
</style></head><body><main>

</div>
